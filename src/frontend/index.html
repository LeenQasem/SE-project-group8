<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Volunteer Management — Increment 1 Demo</title>
  <style>
    :root { color-scheme: light; font: 16px/1.5 system-ui, sans-serif; color: #172b4d; background: #f3f6fa; }
    body { margin: 0; } header { padding: 1.5rem max(1rem, calc((100% - 1000px)/2)); color: white; background: #183b56; }
    main { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; display: grid; gap: 1.25rem; grid-template-columns: repeat(auto-fit,minmax(280px,1fr)); }
    section { background: white; border: 1px solid #dce4ec; border-radius: 12px; padding: 1.25rem; box-shadow: 0 3px 12px #17324d0c; }
    h1,h2 { margin-top: 0; } label { display:block; font-weight:600; margin:.65rem 0 .2rem; } input,select,button { box-sizing:border-box; width:100%; padding:.65rem; border:1px solid #b8c7d6; border-radius:7px; font:inherit; }
    button { margin-top:.8rem; color:white; border:0; background:#176b87; cursor:pointer; font-weight:650; } button.secondary { background:#496579; }
    .row { display:flex; gap:.6rem; } .row button { flex:1; } .muted { color:#526779; font-size:.92rem; } #status { white-space:pre-wrap; padding:.8rem 1rem; background:#e8f2f5; border-radius:8px; }
    table { width:100%; border-collapse:collapse; margin-top:1rem; font-size:.92rem; } th,td { text-align:left; padding:.5rem; border-bottom:1px solid #e1e8ee; }
  </style>
</head>
<body>
  <header><h1>Volunteer Management System</h1><div>Increment 1 demo: registration, login, and role management</div></header>
  <main>
    <section><h2>Account</h2><div id="session" class="muted">Not signed in</div>
      <form id="register"><h3>Register</h3><label for="name">Name</label><input id="name" required maxlength="150" autocomplete="name"><label for="reg-email">Email</label><input id="reg-email" type="email" required autocomplete="email"><label for="reg-password">Password</label><input id="reg-password" type="password" required autocomplete="new-password"><button>Create volunteer account</button></form>
      <form id="login"><h3>Login</h3><label for="login-email">Email</label><input id="login-email" type="email" required autocomplete="username"><label for="login-password">Password</label><input id="login-password" type="password" required autocomplete="current-password"><div class="row"><button>Login</button><button type="button" class="secondary" id="logout">Logout</button></div></form>
    </section>
    <section><h2>Administrator role management</h2><p class="muted">Sign in with an administrator account to view users and update roles.</p><button id="refresh">Load users</button><div id="users"></div></section>
    <section style="grid-column:1/-1"><h2>Activity</h2><div id="status" role="status" aria-live="polite">Ready.</div></section>
  </main>
  <script>
    let token = null;
    const $ = id => document.getElementById(id);
    function message(value) { $('status').textContent = value; }
    function updateSession(user) { $('session').textContent = user ? `${user.full_name} · ${user.email} · ${user.role.role_name}` : 'Not signed in'; }
    async function api(path, options = {}) {
      const headers = {'Content-Type':'application/json', ...(options.headers || {})};
      if (token) headers.Authorization = `Bearer ${token}`;
      const response = await fetch(path, {...options, headers});
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || `Request failed (${response.status})`);
      return data;
    }
    $('register').addEventListener('submit', async event => {
      event.preventDefault();
      try { const user = await api('/api/auth/register', {method:'POST', body:JSON.stringify({name:$('name').value,email:$('reg-email').value,password:$('reg-password').value})}); message(`Account created for ${user.full_name}. You can now log in.`); event.target.reset(); }
      catch (error) { message(error.message); }
    });
    $('login').addEventListener('submit', async event => {
      event.preventDefault();
      try { const data = await api('/api/auth/login', {method:'POST', body:JSON.stringify({email:$('login-email').value,password:$('login-password').value})}); token=data.access_token; updateSession(data.user); message('Login successful.'); event.target.reset(); }
      catch (error) { message(error.message); }
    });
    $('logout').addEventListener('click', async () => {
      if (!token) { message('Sign in before logging out.'); return; }
      try { await api('/api/auth/logout', {method:'POST'}); message('Logged out.'); }
      catch (error) { message(error.message); }
      finally { token=null; updateSession(null); $('users').replaceChildren(); }
    });
    $('refresh').addEventListener('click', async () => {
      try { const data=await api('/api/admin/users'); const table=document.createElement('table'); table.innerHTML='<thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Change role</th></tr></thead>'; const body=document.createElement('tbody');
        for (const user of data.users) { const row=document.createElement('tr'); const name=document.createElement('td'); name.textContent=user.full_name; const email=document.createElement('td'); email.textContent=user.email; const current=document.createElement('td'); current.textContent=user.role.role_name; const cell=document.createElement('td'); const select=document.createElement('select'); for (const [value,label] of [['VOLUNTEER','Volunteer'],['EVENT_ORGANIZER','Event Organizer'],['ADMINISTRATOR','Administrator']]) { const option=document.createElement('option'); option.value=value; option.textContent=label; option.selected=user.role.role_name===label; select.append(option); } const button=document.createElement('button'); button.textContent='Save'; button.onclick=async()=>{ try { await api(`/api/admin/users/${user.user_id}/role`,{method:'PATCH',body:JSON.stringify({role:select.value})}); message(`Updated ${user.full_name}'s role.`); $('refresh').click(); } catch(error) { message(error.message); } }; cell.append(select,button); row.append(name,email,current,cell); body.append(row); }
        table.append(body); $('users').replaceChildren(table); message(`Loaded ${data.users.length} users.`);
      } catch (error) { message(error.message); }
    });
  </script>
</body>
</html>
